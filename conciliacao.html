<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Conciliação">
<meta name="theme-color" content="#f4f6f5">
<meta name="format-detection" content="telephone=no">
<title>Conciliação Bonequim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* App de uma coluna para celular, botões grandes para o dedo, barra de ação fixa embaixo */
:root{
  --bg:#f4f6f5; --surface:#ffffff; --surface-2:#eef1ef; --fg:#18221e; --muted:#5f6b66; --line:#d9dfdc;
  --accent:#1f5f4f; --accent-ink:#ffffff; --accent-soft:#e1eee9;
  --warn:#8a5300; --warn-soft:#fbefd9; --bad:#a1372b; --bad-soft:#f8e3df; --ok:#1d6638; --ok-soft:#e0f1e5; --info:#2c5a86; --info-soft:#e2ecf6;
  --font-body:"Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r:12px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root{
  --bg:#111715; --surface:#19211e; --surface-2:#212b27; --fg:#e6ece9; --muted:#9aa7a1; --line:#2e3a35;
  --accent:#5fb39b; --accent-ink:#0d1714; --accent-soft:#1d3a32;
  --warn:#f0b65c; --warn-soft:#3a2c14; --bad:#f08a7c; --bad-soft:#3b1f1b; --ok:#7fd09a; --ok-soft:#1b3424; --info:#8cb8e6; --info-soft:#1c2b3b;
  color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
[hidden]{display:none!important}
#app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:140px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,textarea{font:inherit;color:var(--fg)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.15}
p{margin:0}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.muted{color:var(--muted)}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}

.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:8px 20px}
.top h1{font-size:28px;font-weight:700;letter-spacing:-.01em}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;white-space:nowrap}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding-block:6px 12px;margin-bottom:4px}
.bar h2{font-size:20px;font-weight:700;flex:1;min-width:0}
.back{border:0;background:transparent;font-weight:600;color:var(--accent);padding:10px 8px 10px 0;font-size:16px}
.sync{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);margin-top:16px}
.sync button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}

.stack{display:flex;flex-direction:column;gap:12px}
.card{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:18px;min-height:76px}
.card .t{font-size:18px;font-weight:700}
.card .s{grid-column:1;font-size:14px;color:var(--muted)}
.card .n{grid-row:1 / span 2;grid-column:2;font-family:var(--font-mono);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.card.main{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);min-height:92px}
.card.main .s{color:var(--accent-ink);opacity:.85}
.card.main .t{font-size:21px}
.card.alert{background:var(--warn-soft);border-color:transparent}
.card.alert .n,.card.alert .t{color:var(--warn)}
.card.approve{background:var(--info-soft);border-color:transparent}
.card.approve .n,.card.approve .t{color:var(--info)}

.note{border-radius:var(--r);padding:12px 14px;font-size:15px}
.note b{display:block;margin-bottom:2px}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.note.info{background:var(--info-soft);color:var(--info)}
.note.plain{background:var(--surface-2);color:var(--fg)}
.gap{margin-bottom:14px}

/* login */
.login{padding-top:8vh;display:flex;flex-direction:column;gap:28px}
.login h1{font-size:32px;font-weight:700;letter-spacing:-.015em}
.who{display:flex;flex-direction:column;gap:10px}
.who-btn{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:18px;background:var(--accent-soft);color:var(--accent);flex:none}
.who-btn .t{font-weight:700;font-size:18px}
.who-btn .s{font-size:14px;color:var(--muted)}
.pin-d{display:flex;justify-content:center;gap:16px;margin:8px 0}
.pin-d i{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted)}
.pin-d i.on{background:var(--fg);border-color:var(--fg)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:320px;margin:0 auto;width:100%}
.pad button{min-height:64px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);font-family:var(--font-mono);font-size:24px;font-weight:600}
.pad button.ghost{border-color:transparent;background:transparent;font-family:var(--font-body);font-size:15px;color:var(--muted)}
.center{text-align:center}
.who-group{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:6px 0 -2px}
.locais{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.loc{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 14px;font-size:14px;font-weight:600;min-height:40px}
.loc.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.loc-pick .loc{flex:1;min-height:48px;font-size:16px;border-radius:10px}
.tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-right:6px;vertical-align:1px}
.foot-link{display:block;text-align:center;margin-top:22px;color:var(--muted);font-size:14px;font-weight:600}

/* contagem */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label{font-weight:600;font-size:14px}
.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;font-size:17px;min-height:48px}
.inp.big{font-family:var(--font-mono);font-size:24px;font-weight:600;letter-spacing:.04em}
.inp[readonly]{background:var(--surface-2)}
textarea.inp{min-height:110px;resize:vertical}
.rows{display:flex;flex-direction:column;gap:12px}
.row{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px}
.row-head{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.row-head .inp{flex:1;min-width:0;text-transform:uppercase;font-weight:600}
.rm{border:1px solid var(--line);background:transparent;border-radius:10px;padding:0 12px;min-height:48px;font-size:14px;color:var(--muted);white-space:nowrap}
.rm.sure{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.grade{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) minmax(0,1.1fr);gap:6px}
.cell{display:flex;flex-direction:column;align-items:stretch;gap:4px;min-width:0}
.cell span{font-size:12px;font-weight:700;text-align:center;color:var(--muted);letter-spacing:.04em}
.cell input{width:100%;min-width:0;text-align:center;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;min-height:48px;font-family:var(--font-mono);font-size:19px;font-weight:600;padding:0}
.cell input:focus{background:var(--surface);border-color:var(--accent)}
.cell.tot b{display:grid;place-items:center;min-height:48px;border-radius:8px;font-family:var(--font-mono);font-size:19px;color:var(--accent);background:var(--accent-soft)}
.add{width:100%;margin-top:12px;border:1.5px dashed var(--accent);color:var(--accent);background:transparent;border-radius:var(--r);min-height:56px;font-weight:700;font-size:17px}
.err{color:var(--bad);font-weight:600;font-size:15px;margin-top:10px}
.linkbtn{border:0;background:transparent;color:var(--bad);font-weight:600;padding:14px 0;font-size:15px}

.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.actionbar-in{max-width:560px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sum{flex:1 1 100%;font-size:14px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.sum b{font-family:var(--font-mono);color:var(--fg);font-size:16px}
.btn{flex:1;min-height:52px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:16px;padding:0 14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.55;cursor:default}

.sheet-bg{position:fixed;inset:0;z-index:20;background:rgba(10,16,14,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;background:var(--surface);border-radius:16px 16px 0 0;padding:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.sheet h3{font-size:20px}
.sheet .btns{display:flex;gap:10px;flex-wrap:wrap}

.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px 16px}
.item-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.item .code{font-family:var(--font-mono);font-size:20px;font-weight:600}
.item .s{font-size:14px;color:var(--muted)}
.item .pc{font-family:var(--font-mono);font-size:15px;color:var(--muted);white-space:nowrap}
.item-wrap{display:flex;flex-direction:column;gap:6px}
.item-actions{display:flex;justify-content:flex-end}
.small-btn{border:0;background:transparent;color:var(--bad);font-weight:600;font-size:14px;padding:6px 4px}
.pill{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.03em;border-radius:999px;padding:3px 10px;white-space:nowrap;align-self:flex-start}
.pill.solicitada{background:var(--warn-soft);color:var(--warn)}
.pill.pendente{background:var(--surface-2);color:var(--fg)}
.pill.corrigir{background:var(--bad-soft);color:var(--bad)}
.pill.aprovacao{background:var(--info-soft);color:var(--info)}
.pill.concluida{background:var(--ok-soft);color:var(--ok)}
.group{display:flex;flex-direction:column;gap:10px;margin-bottom:22px}
.group h3{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px 16px;text-align:center;color:var(--muted)}

.head-code{font-family:var(--font-mono);font-size:34px;font-weight:600;letter-spacing:.02em;margin-top:4px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:16px 0;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);font-size:15px}
.facts dt{color:var(--muted)}
.facts dd{margin:0;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:10px 8px;text-align:center;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th{font-size:12px;letter-spacing:.05em;color:var(--muted);font-weight:700;background:var(--surface-2)}
td.cor,th.cor{text-align:left;padding-left:14px;font-weight:600;min-width:110px}
td.num{font-family:var(--font-mono)}
td.tot{font-family:var(--font-mono);font-weight:700;color:var(--accent)}
tfoot td{font-weight:700;border-bottom:0;background:var(--surface-2);font-family:var(--font-mono)}
tfoot td.cor{font-family:var(--font-body)}
details.hist{margin-top:18px;font-size:14px}
details.hist summary{cursor:pointer;font-weight:600;color:var(--muted);padding:6px 0}
details.hist ol{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(110px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:999px;font-weight:600;font-size:15px;max-width:calc(100% - 32px);text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.loading{padding:40px 0;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){ .toast{animation:pop .18s ease-out} @keyframes pop{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}} }
</style>
</head>
<body>
<div id="app"><div class="loading">Abrindo a conciliação…</div></div>
<div id="toast-slot"></div>

<script>
(function(){
const SIZES = ['PP','P','M','G','GG'];
const ST = { SOL:'SOLICITADA', PEN:'PENDENTE', COR:'CORRIGIR', APR:'AGUARDANDO APROVACAO', OK:'CONCLUIDA' };
const LOCAIS = ['FABRICA','BONEQUIM','AZPEX'];
const NOME_LOCAL = {FABRICA:'Fábrica', BONEQUIM:'Bonequim', AZPEX:'Azpex'};
// local vazio = vê todos os lugares
const USERS = [
  {id:'ana',   nome:'Ana',   local:'FABRICA',  conta:true, desc:'Conta o estoque da Fábrica'},
  {id:'edson', nome:'Edson', local:'BONEQUIM', conta:true, desc:'Conta o estoque da Bonequim'},
  {id:'renan', nome:'Renan', local:'BONEQUIM', conta:true, desc:'Conta o estoque da Bonequim'},
  {id:'rose',  nome:'Rose',  local:'AZPEX',    conta:true, desc:'Conta o estoque da Azpex'},
  {id:'gi',    nome:'Gi',    local:'BONEQUIM', pede:true,  desc:'Pede contagens da Bonequim'},
  {id:'taty',  nome:'Taty',  local:'', conta:true, pede:true, aprova:true, desc:'Pede e aprova contagens'},
  {id:'carol', nome:'Carol', local:'', conta:true, pede:true, aprova:true, desc:'Pede e aprova contagens'}
];
function quemConta(local){ const n = USERS.filter(u=>u.conta && u.local===local).map(u=>u.nome); return n.length>1 ? n.slice(0,-1).join(', ')+' e '+n[n.length-1] : (n[0]||'a equipe'); }
const app = document.getElementById('app');
const toastSlot = document.getElementById('toast-slot');

/* ---------- armazenamento local (sessão e rascunho) ---------- */
function lsGet(k){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }

/* ---------- estado ---------- */
let S = lsGet('conc_sess');           // {user, pin}
let me = S ? USERS.find(u=>u.id===S.user) || null : null;
if(!me) S = null;
let docs = [], loaded = false, netErr = '', lastSync = null, loadingNow = false;
let view = {name:'home'};
let busy = false;
let pinUser = null, pinBuf = '', pinErr = '';

const isAprova = () => !!(me && me.aprova);
const podeContar = () => !!(me && me.conta);
const podePedir = () => !!(me && me.pede);
const veTodos = () => !!(me && !me.local);
let filtroLocal = lsGet('conc_filtro') || '';

/* ---------- conversa com a Vercel ---------- */
async function api(action, dados){
  let r;
  try{
    r = await fetch('/api/conciliacao', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(Object.assign({action:action, user:S && S.user, pin:S && S.pin}, dados||{}))});
  }catch(e){ throw new Error('Sem internet. Confira a conexão e tente de novo.'); }
  let j = {}; try{ j = await r.json(); }catch(e){}
  if(r.status===401 && action!=='entrar'){ sair(); throw new Error('O PIN mudou. Entre de novo.'); }
  if(!r.ok || j.erro) throw new Error(j.erro || 'Algo deu errado. Tente de novo.');
  return j;
}
async function carregar(){
  if(!S || loadingNow) return;
  loadingNow = true;
  try{
    const j = await api('listar');
    docs = j.contagens || []; loaded = true; netErr = ''; lastSync = new Date();
  }catch(e){ netErr = e.message; }
  loadingNow = false;
  onData();
}
setInterval(()=>{ if(S && document.visibilityState==='visible') carregar(); }, 30000);
document.addEventListener('visibilitychange', ()=>{ if(S && document.visibilityState==='visible') carregar(); });

/* ---------- utilidades ---------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function pad(n){ return String(n).padStart(2,'0'); }
function fmt(iso){
  if(!iso) return '';
  const d = new Date(iso); if(isNaN(d)) return '';
  const now = new Date();
  return pad(d.getDate())+'/'+pad(d.getMonth()+1) + (d.getFullYear()!==now.getFullYear() ? '/'+d.getFullYear() : '') + ' às ' + pad(d.getHours())+':'+pad(d.getMinutes());
}
function fmtDia(iso){ if(!iso) return ''; const d = new Date(iso); return isNaN(d) ? '' : pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear(); }
function hora(d){ return pad(d.getHours())+':'+pad(d.getMinutes()); }
function nowIso(){ return new Date().toISOString(); }
function num(v){ const n = parseInt(String(v==null?'':v).replace(/\D/g,''),10); return isNaN(n) ? 0 : n; }
function rowTotal(c){ return SIZES.reduce((a,s)=>a+num(c.q && c.q[s]),0); }
function docTotal(d){ return (d.cores||[]).reduce((a,c)=>a+rowTotal(c),0); }
function pecas(n){ return n===1 ? '1 peça' : n.toLocaleString('pt-BR')+' peças'; }
function visiveis(){ return (veTodos() && filtroLocal) ? docs.filter(d=>d.local===filtroLocal) : docs; }
function byStatus(){ const s = Array.from(arguments); return visiveis().filter(d=>s.includes(d.status)); }
function tagLocal(d){ return veTodos() && d.local ? '<span class="tag">'+esc(NOME_LOCAL[d.local]||d.local)+'</span>' : ''; }
function filtroHTML(){
  if(!veTodos()) return '';
  return '<div class="locais" role="group" aria-label="Filtrar por lugar">'+[['','Todos']].concat(LOCAIS.map(l=>[l,NOME_LOCAL[l]])).map(x=>
    '<button class="loc'+(filtroLocal===x[0]?' on':'')+'" data-act="filtro" data-l="'+x[0]+'">'+x[1]+'</button>').join('')+'</div>';
}
function escolhaLocalHTML(sel, act){
  return '<div class="locais loc-pick" role="group" aria-label="Lugar">'+LOCAIS.map(l=>'<button class="loc'+(sel===l?' on':'')+'" data-act="'+act+'" data-l="'+l+'">'+NOME_LOCAL[l]+'</button>').join('')+'</div>';
}
function abrir(id){
  const d = docs.find(x=>x.id===id); if(!d) return;
  if(podeContar() && [ST.SOL,ST.PEN,ST.COR].includes(d.status)) openEditor(id);
  else go({name:'detalhe', id:id, from:view, mode:null});
}
function sortBy(arr, f, dir){ return arr.slice().sort((a,b)=>{ const x=a[f]||'', y=b[f]||''; return dir==='desc' ? (x<y?1:x>y?-1:0) : (x<y?-1:x>y?1:0); }); }
function statusInfo(d){
  return ({
    [ST.SOL]:{cls:'solicitada', txt:'Solicitada'},
    [ST.PEN]:{cls:'pendente', txt:'Em andamento'},
    [ST.COR]:{cls:'corrigir', txt:'Correção pedida'},

function blankRow(){ return {cor:'', q:{PP:'',P:'',M:'',G:'',GG:''}}; }
function openEditor(id){
  const d = id ? docs.find(x=>x.id===id) : null;
  const key = 'conc_draft_'+(id||'novo');
  const draft = lsGet(key);
  const st = {name:'contar', id:id||null, codigo:'', local: me.local || (filtroLocal||''), cores:[blankRow()], err:'', rm:-1, sheet:null, restored:false, abertoEm:nowIso()};
  if(d){
    st.codigo = d.codigo||''; st.local = d.local||'';
    st.cores = (d.cores && d.cores.length) ? d.cores.map(c=>({cor:c.cor||'', q:Object.assign({PP:'',P:'',M:'',G:'',GG:''}, c.q||{})})) : [blankRow()];
    SIZES.forEach(s=>st.cores.forEach(c=>{ if(c.q[s]===null || c.q[s]===undefined) c.q[s]=''; c.q[s] = String(c.q[s]); }));
  }
  if(draft && draft.cores && (!d || (draft.ts||'') > (d.atualizadoEm||d.solicitadoEm||''))){
    const has = draft.codigo || draft.cores.some(c=>c.cor || SIZES.some(s=>String(c.q[s]||'')!==''));
    if(has){ st.codigo = (d && d.solicitadoPor) ? d.codigo : (draft.codigo || st.codigo); if(!d && !me.local && draft.local) st.local = draft.local; st.cores = draft.cores; st.restored = true; }
  }
  st.snapshot = st.restored ? '' : JSON.stringify({c:st.codigo, r:st.cores});
  go(st);
}
function dirty(){ return view.name==='contar' && JSON.stringify({c:view.codigo, r:view.cores}) !== view.snapshot; }

function sheetHTML(){

      '<div class="muted" style="font-size:14px">Depois de enviar, a Taty ou a Carol aprovam ou pedem correção.</div>',
      ['<button class="btn" data-act="sheet-close">Voltar</button>','<button class="btn primary" data-act="ed-finish-ok">Enviar</button>']);
  }
  if(s.type==='back') return wrap('Sair da contagem?','<div class="muted">Tem coisa digitada que não foi salva.</div>',
      ['<button class="btn primary" data-act="ed-save">Salvar e sair</button>','<button class="btn danger" data-act="ed-leave">Sair sem salvar</button>','<button class="btn" data-act="sheet-close">Continuar contando</button>']);
  if(s.type==='discard'){
    const d = docs.find(x=>x.id===st.id); const sol = d && d.solicitadoPor;
    return wrap(sol ? 'Apagar o que foi contado?' : 'Excluir esta contagem?',

      ['<button class="btn" data-act="sheet-close">Voltar</button>','<button class="btn danger" data-act="ed-discard-ok">'+(sol?'Apagar':'Excluir')+'</button>']);
  }
  return '';
}
function updateDupWarn(){
  const box = document.getElementById('dup-warn'); if(!box) return;
  const code = (view.codigo||'').trim();
  if(!code || view.id){ box.innerHTML=''; return; }
  if(!view.local){ box.innerHTML=''; return; }
  const open = docs.find(d=>d.codigo===code && d.local===view.local && [ST.PEN,ST.COR,ST.APR].includes(d.status));
  const sol = docs.find(d=>d.codigo===code && d.local===view.local && d.status===ST.SOL);
  if(open){
    box.innerHTML = '<div class="note warn" style="margin:-4px 0 16px"><b>Esse código já tem contagem '+(open.status===ST.APR?'aguardando aprovação':'em andamento')+'</b>'+
      (open.status!==ST.APR ? '<button class="btn" style="margin-top:8px;width:100%" data-act="open-edit" data-id="'+open.id+'">Abrir a contagem que já existe</button>' : 'Espere a aprovação antes de contar de novo.')+'</div>';
  } else if(sol){
    box.innerHTML = '<div class="note info" style="margin:-4px 0 16px">Esse código foi pedido por '+esc(sol.solicitadoPor)+'. Ao salvar, o pedido sai da lista de solicitações.</div>';
  } else box.innerHTML = '';
}
function refreshTotals(){
  view.cores.forEach((c,i)=>{ const el = document.getElementById('rt-'+i); if(el) el.textContent = rowTotal(c); });
  const gt = document.getElementById('gt'); if(gt) gt.textContent = view.cores.reduce((a,c)=>a+rowTotal(c),0);
  const gc = document.getElementById('gt-cores'); if(gc){ const k = view.cores.filter(c=>c.cor.trim()).length; gc.textContent = k+(k===1?' cor':' cores'); }
}
function rerenderEditor(focusId){
  const y = window.scrollY;
  app.innerHTML = editorHTML(); updateDupWarn();
  window.scrollTo(0,y);
  if(focusId){ const el = document.getElementById(focusId); if(el) el.focus(); }
}
function validate(final){
  const codigo = (view.codigo||'').trim();
  if(!view.local) return {err:'Escolha onde é a contagem: Fábrica, Bonequim ou Azpex.'};
  if(!codigo) return {err:'Digite o código.'};
  const seen = {}; let n = 0;
  for(let i=0;i<view.cores.length;i++){
    const c = view.cores[i];
    const cor = (c.cor||'').trim().toUpperCase().replace(/\s+/g,' ');
    const hasQ = SIZES.some(s=>String(c.q[s]||'')!=='');
    if(!cor && !hasQ) continue;
    if(!cor) return {err:'Falta o nome da cor na linha '+(i+1)+'.'};
    if(seen[cor]) return {err:'A cor '+cor+' aparece duas vezes. Junte numa linha só.'};
    seen[cor] = 1; n++;
  }
  if(final && !n) return {err:'Adicione pelo menos uma cor antes de finalizar.'};
  return {ok:true};
}
async function persist(final){
  const v = validate(final);
  if(v.err){ view.err = v.err; view.sheet = null; rerenderEditor(); return; }
  busy = final ? 'final' : 'save'; view.sheet = null; view.err=''; rerenderEditor();
  const ed = view;
  try{
    await api('salvar', {id:ed.id, codigo:ed.codigo.trim(), local:ed.local, cores:ed.cores, final:final, abertoEm:ed.abertoEm});
    lsDel('conc_draft_'+(ed.id||'novo'));
    busy = false;
    toast(final ? 'Enviado para aprovação.' : 'Salvo. Está em Contagem pendente.');
    go({name:'home'}); carregar();
  }catch(e){
    busy = false; if(view===ed){ view.err = e.message; rerenderEditor(); } else toast(e.message);
  }
}
async function discard(){
  const ed = view;
  busy = 'save'; view.sheet = null; rerenderEditor();
  try{
    await api('descartar', {id:ed.id});
    lsDel('conc_draft_'+ed.id);
    busy = false; toast('Pronto.'); go({name:'home'}); carregar();
  }catch(e){ busy = false; view.err = e.message; rerenderEditor(); }
}

function detalheHTML(){
  const d = docs.find(x=>x.id===view.id);
  let h = '<header class="bar"><button class="back" data-act="det-back">‹ Voltar</button><h2>Contagem</h2></header>';
  if(!d) return h + empty('Essa contagem não existe mais.');
  h += pill(d)+'<div class="head-code">'+esc(d.codigo)+'</div>';
  const f = [['Lugar', esc(NOME_LOCAL[d.local]||d.local)]];
  if(d.solicitadoPor) f.push(['Solicitada', esc(d.solicitadoPor)+' · '+esc(fmt(d.solicitadoEm))]);
  if(d.iniciadoEm) f.push(['Iniciada', esc(fmt(d.iniciadoEm))]);
  if(d.finalizadoEm) f.push(['Finalizada', esc(fmt(d.finalizadoEm))]);
  if(d.finalizadoPor || d.iniciadoPor) f.push(['Contado por', esc(d.finalizadoPor || d.iniciadoPor)]);
  if(d.status===ST.OK){ f.push(['Conciliada em', esc(fmtDia(d.conciliadoEm))]); f.push(['Aprovada por', esc(d.aprovadoPor)]); }
  f.push(['Total', pecas(docTotal(d))]);
  h += '<dl class="facts">'+f.map(x=>'<dt>'+x[0]+'</dt><dd>'+x[1]+'</dd>').join('')+'</dl>';
  if(d.correcao) h += '<div class="note '+(d.status===ST.COR?'bad':'plain')+' gap"><b>'+(d.status===ST.COR?'Correção pedida':'Teve correção pedida')+' por '+esc(d.correcao.por)+' · '+esc(fmt(d.correcao.em))+'</b>'+esc(d.correcao.motivo||'')+'</div>';
  h += tabelaHTML(d);
  if(d.status===ST.APR && isAprova()){
    if(view.mode==='corrigir'){
      h += '<div class="field" style="margin-top:18px"><label for="f-motivo">O que precisa corrigir?</label><textarea class="inp" id="f-motivo" placeholder="Ex.: recontar o PRETO no M, deu diferente do sistema">'+esc(view.motivo||'')+'</textarea></div>';
      if(view.err) h += '<div class="err">'+esc(view.err)+'</div>';
      h += '<div class="actionbar"><div class="actionbar-in"><button class="btn" data-act="corr-cancel">Cancelar</button><button class="btn danger" data-act="corr-ok"'+(busy?' disabled':'')+'>'+(busy?'Enviando…':'Enviar correção')+'</button></div></div>';
    } else {
      if(view.err) h += '<div class="err">'+esc(view.err)+'</div>';
      h += '<div class="actionbar"><div class="actionbar-in"><div class="sum"><span>A conciliação fica registrada com a data de hoje</span></div>'+
           '<button class="btn danger" data-act="corr"'+(busy?' disabled':'')+'>Corrigir</button><button class="btn ok" data-act="aprovar"'+(busy?' disabled':'')+'>'+(busy?'Aprovando…':'Aprovar')+'</button></div></div>';
    }
  } else if(d.status===ST.APR){
    h += '<div class="note info" style="margin-top:16px">Esperando a Taty ou a Carol aprovarem.</div>';
  } else if((d.status===ST.PEN || d.status===ST.COR || d.status===ST.SOL) && podeContar()){
    h += '<div class="actionbar"><div class="actionbar-in"><button class="btn primary" data-act="open-edit" data-id="'+esc(d.id)+'">'+(d.status===ST.SOL?'Iniciar contagem':'Continuar contagem')+'</button></div></div>';
  }
  const hs = d.historico||[];
  if(hs.length) h += '<details class="hist"><summary>Histórico ('+hs.length+')</summary><ol>'+hs.map(x=>'<li>'+esc(fmt(x.em))+' · '+esc(x.por)+': '+esc(x.acao)+'</li>').join('')+'</ol></details>';
  return h;
}
function tabelaHTML(d){
  const cores = d.cores||[];
  if(!cores.length) return empty('Nenhuma cor contada ainda.');
  const tot = {}; SIZES.forEach(s=>tot[s]=cores.reduce((a,c)=>a+num(c.q&&c.q[s]),0));
  return '<div class="tbl-wrap"><table><thead><tr><th class="cor">COR</th>'+SIZES.map(s=>'<th>'+s+'</th>').join('')+'<th>TOTAL</th></tr></thead><tbody>'+
    cores.map(c=>'<tr><td class="cor">'+esc(c.cor)+'</td>'+SIZES.map(s=>{ const v = c.q ? c.q[s] : ''; return '<td class="num">'+(v===''||v==null?'<span class="muted">·</span>':esc(v))+'</td>'; }).join('')+'<td class="tot">'+rowTotal(c)+'</td></tr>').join('')+
    '</tbody><tfoot><tr><td class="cor">Total</td>'+SIZES.map(s=>'<td>'+tot[s]+'</td>').join('')+'<td>'+docTotal(d)+'</td></tr></tfoot></table></div>';
}
async function aprovar(){
  const v0 = view; busy = true; view.err=''; render();
  try{ await api('aprovar', {id:v0.id}); busy = false; toast('Aprovada. Foi para Contagem concluída.'); go({name:'home'}); carregar(); }
  catch(e){ busy = false; v0.err = e.message; if(view===v0) render(); }
}
async function pedirCorrecao(){
  const v0 = view; const motivo = (view.motivo||'').trim();
  if(!motivo){ view.err = 'Escreva o que precisa corrigir.'; render(); return; }
  busy = true; view.err=''; render();
  try{ await api('corrigir', {id:v0.id, motivo:motivo}); busy = false; toast('Correção enviada pra '+quemConta((docs.find(x=>x.id===v0.id)||{}).local)+'.'); go({name:'home'}); carregar(); }
  catch(e){ busy = false; v0.err = e.message; if(view===v0) render(); }
}

/* ---------- solicitar ---------- */
function solicitarHTML(){
  let h = '<header class="bar"><button class="back" data-act="home">‹ Início</button><h2>Solicitar contagem</h2></header>';
  if(!me.local) h += '<div class="field"><label>Onde contar?</label>'+escolhaLocalHTML(view.local,'sol-local')+'</div>';
  else h += '<div class="note plain gap">O pedido vai pra '+esc(quemConta(me.local))+', no estoque da '+esc(NOME_LOCAL[me.local])+'.</div>';
  h += '<div class="field"><label for="f-codigos">Códigos pra contar</label><textarea class="inp mono" id="f-codigos" inputmode="numeric" placeholder="Um ou vários. Ex.:&#10;0192432&#10;0782256">'+esc(view.codigos||'')+'</textarea><span class="muted" style="font-size:13px">Pode colar vários, um por linha.</span></div>';
  h += '<div class="field"><label for="f-obs">Observação (opcional)</label><input class="inp" id="f-obs" autocomplete="off" placeholder="Ex.: olhar também a estante do fundo" value="'+esc(view.obs||'')+'"></div>';
  if(view.err) h += '<div class="err" role="alert">'+esc(view.err)+'</div>';
  h += '<div class="actionbar"><div class="actionbar-in"><button class="btn primary" data-act="sol-ok"'+(busy?' disabled':'')+'>'+(busy?'Enviando…':(view.local?'Enviar pra '+esc(quemConta(view.local)):'Enviar pedido'))+'</button></div></div>';
  return h;
}
async function solicitar(){
  const codes = Array.from(new Set(String(view.codigos||'').split(/[\s,;]+/).map(s=>s.trim()).filter(Boolean)));
  if(!view.local){ view.err = 'Escolha onde contar: Fábrica, Bonequim ou Azpex.'; render(); return; }
  if(!codes.length){ view.err = 'Digite pelo menos um código.'; render(); return; }
  const v0 = view; busy = true; view.err=''; render();
  try{
    const j = await api('solicitar', {codigos:codes, local:view.local, obs:(view.obs||'').trim()});
    busy = false;
    const nov = j.novos||[], ja = j.jaAbertos||[];
    if(!nov.length){ v0.err = 'Esses códigos já estão em aberto: '+ja.join(', ')+'.'; if(view===v0) render(); return; }
    toast((nov.length===1?'1 código enviado':nov.length+' códigos enviados')+' pra '+quemConta(v0.local)+'.'+(ja.length?' Já estavam em aberto: '+ja.join(', ')+'.':''));
    go({name:'home'}); carregar();
  }catch(e){ busy = false; v0.err = e.message; if(view===v0) render(); }
}
async function cancelarSol(id){
  if(view.cancel!==id){ view.cancel = id; renderListBody(); return; }
  try{ await api('cancelar', {id:id}); view.cancel=null; toast('Pedido cancelado.'); carregar(); }
  catch(e){ toast(e.message); }
}

/* ---------- eventos ---------- */
app.addEventListener('click', e=>{
  const g = e.target.closest('[data-go]');
  if(g){
    if(!me) return;
    const to = g.dataset.go;
    if(to==='novo') return openEditor(null);
    if(to==='solicitar') return go({name:'solicitar', local: me.local || filtroLocal || '', codigos:'', obs:'', err:''});
    if(to.indexOf('lista:')===0){ go({name:'lista', tipo:to.slice(6), q:''}); carregar(); }
    return;
  }
  const b = e.target.closest('[data-act]'); if(!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  switch(act){
    case 'login': pinUser = b.dataset.u; pinBuf=''; pinErr=''; render(); break;
    case 'pin': digitaPin(b.dataset.n); break;
    case 'pin-apaga': pinBuf = pinBuf.slice(0,-1); render(); break;
    case 'pin-voltar': pinUser = null; pinBuf=''; pinErr=''; render(); break;
    case 'logout': sair(); break;
    case 'refresh': carregar(); syncLine(); break;
    case 'home': go({name:'home'}); carregar(); break;
    case 'addrow': view.cores.push(blankRow()); view.rm=-1; saveDraft(); rerenderEditor('cor-'+(view.cores.length-1)); break;
    case 'rmrow': {
      const i = +b.dataset.i;
      const c = view.cores[i]; const has = c.cor.trim() || SIZES.some(s=>String(c.q[s]||'')!=='');
      if(has && view.rm!==i){ view.rm = i; rerenderEditor(); break; }
      view.cores.splice(i,1); if(!view.cores.length) view.cores.push(blankRow()); view.rm=-1; saveDraft(); rerenderEditor(); break;
    }
    case 'ed-back': if(dirty()){ view.sheet={type:'back'}; rerenderEditor(); } else { lsDel('conc_draft_'+(view.id||'novo')); go({name:'home'}); } break;
    case 'ed-leave': lsDel('conc_draft_'+(view.id||'novo')); go({name:'home'}); break;
    case 'sheet-close': view.sheet=null; rerenderEditor(); break;
    case 'ed-save': if(!busy) persist(false); break;
    case 'ed-finish': { const v = validate(true); if(v.err){ view.err=v.err; rerenderEditor(); break; } view.err=''; view.sheet={type:'finish'}; rerenderEditor(); break; }
    case 'ed-finish-ok': if(!busy) persist(true); break;
    case 'ed-discard': view.sheet={type:'discard'}; rerenderEditor(); break;
    case 'ed-discard-ok': if(!busy) discard(); break;
    case 'open-edit': openEditor(id); break;
    case 'abrir': abrir(id); break;
    case 'filtro': filtroLocal = b.dataset.l; lsSet('conc_filtro', filtroLocal); render(); break;
    case 'ed-local': view.local = b.dataset.l; view.err=''; saveDraft(); rerenderEditor(); break;
    case 'sol-local': view.local = b.dataset.l; view.err=''; render(); break;
    case 'det-back': go(view.from && view.from.name==='lista' ? {name:'lista', tipo:view.from.tipo, q:view.from.q||''} : {name:'home'}); break;
    case 'aprovar': if(!busy) aprovar(); break;
    case 'corr': view.mode='corrigir'; view.err=''; render(); setTimeout(()=>{ const t=document.getElementById('f-motivo'); if(t) t.focus(); },0); break;
    case 'corr-cancel': view.mode=null; view.err=''; render(); break;
    case 'corr-ok': if(!busy) pedirCorrecao(); break;
    case 'sol-ok': if(!busy) solicitar(); break;
    case 'cancel-sol': cancelarSol(id); break;
  }
});
app.addEventListener('input', e=>{
  const t = e.target;
  if(view.name==='contar'){
    if(t.id==='f-codigo'){ view.codigo = t.value.replace(/\s/g,''); if(t.value!==view.codigo) t.value=view.codigo; updateDupWarn(); saveDraft(); return; }
    if(t.dataset.cor!=null){ view.cores[+t.dataset.cor].cor = t.value; refreshTotals(); saveDraft(); return; }
    if(t.dataset.qi!=null){
      const clean = t.value.replace(/\D/g,'').slice(0,4);
      if(t.value!==clean) t.value = clean;
      view.cores[+t.dataset.qi].q[t.dataset.qs] = clean;
      refreshTotals(); saveDraft(); return;
    }
  }
  if(view.name==='lista' && t.id==='f-busca'){ view.q = t.value.replace(/\D/g,''); renderListBody(); return; }
  if(view.name==='solicitar'){ if(t.id==='f-codigos') view.codigos=t.value; if(t.id==='f-obs') view.obs=t.value; return; }
  if(view.name==='detalhe' && t.id==='f-motivo'){ view.motivo = t.value; return; }
});
app.addEventListener('keydown', e=>{
  // Enter pula pro próximo campo da contagem
  const t = e.target;
  if(e.key==='Enter' && view.name==='contar' && (t.dataset.qi!=null || t.dataset.cor!=null || t.id==='f-codigo')){
    e.preventDefault();
    const all = Array.from(app.querySelectorAll('#f-codigo, [data-cor], [data-qi]'));
    const i = all.indexOf(t); if(i>-1 && all[i+1]) all[i+1].focus();
  }
});

// link pessoal (?u=ana) abre direto no PIN daquela pessoa
try{ const q = new URLSearchParams(location.search).get('u'); if(q && USERS.some(u=>u.id===q)){ if(S && S.user!==q) sair(); if(!S) pinUser = q; } }catch(e){}
render();
if(S) carregar();
})();
</script>
