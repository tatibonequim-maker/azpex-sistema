<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Envio">
<meta name="theme-color" content="#FCFBFA">
<meta name="format-detection" content="telephone=no">
<title>Envio Bonequim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FCFBFA; --sf:#FFFFFF; --s2:#F4F2F3; --s3:#E9E5E7; --bd:#E9E5E7; --bd2:#CDC7CA; --bdi:#8B8488;
  --tx:#22191E; --mt:#5B5157; --mts:#71666C;
  --ok:#1F6350;  --okb:#D5F0E5; --okw:#EFFAF5;
  --al:#8E4728;  --alb:#FDE0D2; --alw:#FFF4EF;
  --av:#6E5A12;  --avb:#FBF0C9; --avw:#FEFAEB;
  --in:#33478C;  --inb:#DEE6FB; --inw:#F2F5FE;
  --rs:#8A3355;  --rsb:#FBDFE8; --rsw:#FEF3F6;
  --pri:#22191E; --prit:#FFFFFF;
  --r:14px;
  --mono:'DM Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:16px;line-height:1.4;min-height:100vh;padding-bottom:calc(110px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-appearance:none;appearance:none;-webkit-tap-highlight-color:transparent}
input,textarea{font:inherit;color:inherit;-webkit-appearance:none;appearance:none}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}

/* topo */
.top{position:sticky;top:0;z-index:20;background:rgba(252,251,250,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--bd)}
.top .wrap{display:flex;align-items:center;gap:10px;min-height:56px;padding-top:env(safe-area-inset-top)}
.top h1{font-size:17px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .back{width:40px;height:40px;margin-left:-8px;border-radius:10px;display:grid;place-items:center;font-size:22px}
.top .who{font-size:13px;color:var(--mt);padding:8px 10px;border-radius:999px;background:var(--s2)}
.save{font-size:12px;color:var(--mts);white-space:nowrap}
.save.err{color:var(--al);font-weight:600}

/* abas da Taty */
.tabs{display:flex;gap:6px;padding:10px 0 2px;overflow-x:auto}
.tab{padding:9px 14px;border-radius:999px;background:var(--s2);font-size:14px;font-weight:600;color:var(--mt);white-space:nowrap}
.tab.on{background:var(--pri);color:var(--prit)}
.tab .n{display:inline-block;min-width:20px;margin-left:4px;padding:0 6px;border-radius:999px;background:var(--alb);color:var(--al);font-size:12px}

h2{font-size:13px;font-weight:600;color:var(--mt);text-transform:uppercase;letter-spacing:.04em;margin:22px 0 10px}
.vazio{padding:28px 16px;text-align:center;color:var(--mt);background:var(--sf);border:1px dashed var(--bd2);border-radius:var(--r)}
.vazio b{display:block;color:var(--tx);font-size:17px;margin-bottom:4px}

/* cartão de envio */
.ecard{display:block;width:100%;text-align:left;background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:14px 16px;margin-bottom:10px}
.ecard .l1{display:flex;align-items:center;gap:8px;justify-content:space-between}
.ecard .t{font-weight:700;font-size:16px}
.ecard .l2{font-size:14px;color:var(--mt);margin-top:4px}
.ecard .l3{font-size:13px;color:var(--mts);margin-top:6px}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px;white-space:nowrap}
.st-RASCUNHO{background:var(--s3);color:var(--mt)}
.st-SEPARAR{background:var(--avb);color:var(--av)}
.st-TRANSFERIR{background:var(--inb);color:var(--in)}
.st-RECEBER{background:var(--rsb);color:var(--rs)}
.st-DIVERGENCIA{background:var(--alb);color:var(--al)}
.st-CONCLUIDO{background:var(--okb);color:var(--ok)}

/* linha do tempo */
.trilha{display:flex;gap:4px;margin:14px 0 4px}
.trilha div{flex:1;height:5px;border-radius:3px;background:var(--s3)}
.trilha div.f{background:var(--ok)}
.trilha div.a{background:var(--av)}
.trilha-l{display:flex;justify-content:space-between;font-size:11px;color:var(--mts)}

/* bloco por código */
.cod{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.cod-h{padding:12px 14px 10px;border-bottom:1px solid var(--bd);background:var(--s2)}
.cod-h .c{font-family:var(--mono);font-weight:600;font-size:17px;letter-spacing:.02em}
.cod-h .d{font-size:13px;color:var(--mt);margin-top:1px}
.cor{padding:10px 14px 4px}
.cor+.cor{border-top:1px solid var(--bd)}
.cor-n{font-weight:700;font-size:15px;margin-bottom:6px}
.lin{display:flex;align-items:center;gap:8px;padding:6px 8px;margin:0 -8px 4px;border-radius:10px}
.lin .tm{width:46px;font-family:var(--mono);font-weight:600;font-size:18px}
.lin .pd{flex:1;font-size:14px;color:var(--mt);min-width:0}
.lin .pd b{color:var(--tx);font-size:16px}
.lin .pd small{display:block;font-size:12px;font-weight:600}
.lin input{width:68px;height:48px;border:1.5px solid var(--bdi);border-radius:10px;background:var(--sf);text-align:center;font-family:var(--mono);font-size:20px;font-weight:600}
.lin input:focus{outline:3px solid var(--inb);border-color:var(--in)}
.qb{height:48px;min-width:48px;padding:0 10px;border-radius:10px;border:1.5px solid var(--bd2);background:var(--sf);font-size:14px;font-weight:600}
.qb.ok{color:var(--ok)}
.qb.no{color:var(--al)}
.lin.s-ok{background:var(--okw)} .lin.s-ok small{color:var(--ok)}
.lin.s-menos{background:var(--alw)} .lin.s-menos small{color:var(--al)}
.lin.s-zero{background:var(--alw)} .lin.s-zero small{color:var(--al)}
.lin.s-mais{background:var(--inw)} .lin.s-mais small{color:var(--in)}
.lin.s-ok input{border-color:var(--ok)}
.lin.s-menos input,.lin.s-zero input{border-color:var(--al)}

/* lista compacta (Dai) */
.cmp{padding:10px 14px}
.cmp+.cmp{border-top:1px solid var(--bd)}
.cmp .n{font-weight:700;font-size:15px}
.cmp .q{font-family:var(--mono);font-size:16px;margin-top:2px;line-height:1.7}
.cmp .q span{display:inline-block;margin-right:14px;white-space:nowrap}
.cod.feito{opacity:.5}
.cod.feito .cod-h{background:var(--okw)}
.marca{float:right;font-size:13px;font-weight:600;padding:6px 10px;border-radius:999px;border:1.5px solid var(--bd2);background:var(--sf)}
.cod.feito .marca{border-color:var(--ok);color:var(--ok)}

/* tabela da Taty */
.tb{width:100%;border-collapse:collapse;font-size:14px}
.tb th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mts);font-weight:600;text-align:right;padding:4px 6px}
.tb th:first-child,.tb td:first-child{text-align:left}
.tb td{padding:6px;text-align:right;font-family:var(--mono);border-top:1px solid var(--bd)}
.tb td.x{color:var(--al);font-weight:600}
.tb td.o{color:var(--ok)}

/* barra de baixo */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--sf);border-top:1px solid var(--bd);padding:10px 0 calc(10px + env(safe-area-inset-bottom))}
.bar .wrap{display:flex;align-items:center;gap:12px}
.bar .pr{flex:1;font-size:13px;color:var(--mt);min-width:0}
.bar .pr b{display:block;font-size:16px;color:var(--tx)}
.btn{height:52px;padding:0 20px;border-radius:12px;background:var(--pri);color:var(--prit);font-weight:700;font-size:16px;white-space:nowrap}
.btn.sec{background:var(--sf);color:var(--tx);border:1.5px solid var(--bd2)}
.btn.perigo{background:var(--sf);color:var(--al);border:1.5px solid var(--alb)}
.btn.ok{background:var(--ok)}
.btn:disabled{opacity:.45}
.btn.w{width:100%}

.filtro{display:flex;gap:6px;margin:12px 0}
.campo{display:block;margin:12px 0}
.campo span{display:block;font-size:13px;font-weight:600;color:var(--mt);margin-bottom:6px}
.campo input,.campo textarea{width:100%;border:1.5px solid var(--bdi);border-radius:10px;background:var(--sf);padding:12px;font-size:16px}
.campo textarea{min-height:180px;font-family:var(--mono);font-size:14px;line-height:1.45}
.add{display:grid;grid-template-columns:1.2fr 1.4fr .8fr .8fr auto;gap:6px;align-items:end}
.add input{width:100%;height:48px;border:1.5px solid var(--bdi);border-radius:10px;background:var(--sf);padding:0 10px;font-size:15px;text-transform:uppercase}
.add label{font-size:11px;color:var(--mts);font-weight:600;display:block;margin-bottom:4px}
.aviso{font-size:14px;padding:12px 14px;border-radius:12px;background:var(--avw);border:1px solid var(--avb);color:var(--av);margin:10px 0}
.aviso.erro{background:var(--alw);border-color:var(--alb);color:var(--al)}
.aviso.ok{background:var(--okw);border-color:var(--okb);color:var(--ok)}
.rm{width:36px;height:36px;border-radius:10px;color:var(--al);font-size:20px}
.mini{font-size:13px;color:var(--mt)}
.hist{font-size:13px;color:var(--mt);line-height:1.7}

/* faltas */
.fl{display:flex;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--bd)}
.fl:first-child{border-top:0}
.fl .i{flex:1;min-width:0}
.fl .i b{font-family:var(--mono)}
.fl .i div{font-size:13px;color:var(--mt)}
.fl .q{font-family:var(--mono);color:var(--al);font-weight:600;white-space:nowrap}
.fl.ok{opacity:.5}
.ck{width:44px;height:44px;border-radius:10px;border:1.5px solid var(--bdi);display:grid;place-items:center;font-size:20px;color:var(--ok);flex:none}
.fl.ok .ck{background:var(--okb);border-color:var(--ok)}

/* login */
.login{max-width:420px;margin:0 auto;padding:40px 16px}
.login h1{font-size:26px;font-weight:700}
.login p{color:var(--mt);margin:4px 0 24px}
.pess{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pess button{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:18px 14px;text-align:left}
.pess b{display:block;font-size:18px}
.pess span{font-size:13px;color:var(--mt)}
.pin-d{display:flex;justify-content:center;gap:14px;margin:26px 0}
.pin-d i{width:16px;height:16px;border-radius:50%;border:2px solid var(--bdi)}
.pin-d i.on{background:var(--tx);border-color:var(--tx)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:0 auto}
.pad button{height:64px;border-radius:14px;background:var(--sf);border:1px solid var(--bd);font-size:24px;font-weight:600}
.err{color:var(--al);text-align:center;min-height:22px;font-size:14px;font-weight:600}

/* modal */
.mod{position:fixed;inset:0;z-index:50;background:rgba(34,25,30,.45);display:flex;align-items:flex-end;justify-content:center}
.mod .box{background:var(--sf);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:22px 16px calc(16px + env(safe-area-inset-bottom))}
@media(min-width:600px){.mod{align-items:center}.mod .box{border-radius:18px}}
.mod h3{font-size:19px;margin-bottom:8px}
.mod p{color:var(--mt);margin-bottom:18px}
.mod .bts{display:flex;gap:10px}
.mod .bts .btn{flex:1}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--tx);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:90vw}
.carreg{padding:40px 0;text-align:center;color:var(--mt)}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ENVIO FÁBRICA > BONEQUIM
   Taty aprova a lista, Ana separa pelo celular, Dai transfere no Miré,
   Gi confere na loja. O que não tinha vai pro relatório de faltas da Taty. */

const PESSOAS = {
  taty:{nome:'Taty', papel:'monta e aprova'},
  ana:{nome:'Ana', papel:'separa no estoque'},
  dai:{nome:'Dai', papel:'faz a transferência'},
  gi:{nome:'Gi', papel:'recebe na Bonequim'},
};
const ETAPA = {
  RASCUNHO:{l:'Rascunho', quem:'Taty'},
  SEPARAR:{l:'Separando', quem:'Ana'},
  TRANSFERIR:{l:'Transferir', quem:'Dai'},
  RECEBER:{l:'Na loja p/ conferir', quem:'Gi'},
  DIVERGENCIA:{l:'Diferença', quem:'Dai'},
  CONCLUIDO:{l:'Concluído', quem:''},
};
const ORDEM = ['RASCUNHO','SEPARAR','TRANSFERIR','RECEBER','CONCLUIDO'];
const MINHAS = { ana:['SEPARAR'], dai:['TRANSFERIR','DIVERGENCIA'], gi:['RECEBER'] };

// ── utilidades ──
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} },
};
function dataCurta(ms){ const d=new Date(ms); return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0'); }
function hora(ms){ const d=new Date(ms); return dataCurta(ms)+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }
function chip(st){ return '<span class="chip st-'+st+'">'+esc(ETAPA[st]?.l||st)+'</span>'; }
function plural(n,s,p){ return n+' '+(n===1?s:p); }

function modal(titulo, texto, sim, nao, perigo){
  return new Promise((ok)=>{
    const m=document.createElement('div'); m.className='mod';
    m.innerHTML='<div class="box" role="dialog" aria-modal="true"><h3>'+esc(titulo)+'</h3><p>'+texto+'</p><div class="bts">'+
      (nao?'<button class="btn sec" data-r="0">'+esc(nao)+'</button>':'')+
      '<button class="btn '+(perigo?'perigo':'')+'" data-r="1">'+esc(sim)+'</button></div></div>';
    m.addEventListener('click',(e)=>{ const b=e.target.closest('[data-r]'); if(b||e.target===m){ m.remove(); ok(!!(b&&b.dataset.r==='1')); } });
    document.body.appendChild(m);
  });
}

// ── sessão e API ──
let S = ls.get('envio_sess');
async function api(action, dados={}){
  if(!S) throw new Error('sem login');
  let r, j;
  try {
    r = await fetch('/api/envio',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,user:S.user,pin:S.pin,...dados})});
    j = await r.json().catch(()=>({error:'Resposta estranha do servidor'}));
  } catch(e){ const er=new Error('Sem internet. Tente de novo.'); er.rede=true; throw er; }
  if(r.status===401 && action!=='entrar'){ sair(); throw new Error('PIN mudou. Entre de novo.'); }
  if(!r.ok) throw new Error(j.error||'Erro');
  return j;
}
function sair(){ S=null; ls.del('envio_sess'); location.hash=''; render(); }

// ── fila de gravação (cada número digitado é salvo sozinho; se cair a internet, tenta de novo) ──
const fila = new Map(); let gravando=false; let erroFila=false;
function enfileirar(action, id, item, q){
  fila.set(action+'|'+id+'|'+item, {action,id,item,q});
  ls.set('envio_fila', [...fila.values()]);
  marcaSalvo(); rodarFila();
}
async function rodarFila(){
  if(gravando) return; gravando=true;
  while(fila.size){
    const [k,v] = fila.entries().next().value;
    try { await api(v.action,{id:v.id,item:v.item,q:v.q}); if(fila.get(k)===v) fila.delete(k); erroFila=false; }
    catch(e){
      if(e.rede){ erroFila=true; marcaSalvo(); await new Promise(r=>setTimeout(r,4000)); continue; }
      fila.delete(k); toast(e.message);
    }
    ls.set('envio_fila',[...fila.values()]); marcaSalvo();
  }
  gravando=false; marcaSalvo();
}
function marcaSalvo(){
  const el=$('#salvo'); if(!el) return;
  if(erroFila){ el.textContent='sem internet, guardando'; el.className='save err'; }
  else if(fila.size||gravando){ el.textContent='salvando...'; el.className='save'; }
  else { el.textContent='tudo salvo'; el.className='save'; }
}
(ls.get('envio_fila')||[]).forEach(v=>fila.set(v.action+'|'+v.id+'|'+v.item,v));
async function esperarFila(){ rodarFila(); for(let i=0;i<60&&fila.size;i++) await new Promise(r=>setTimeout(r,500)); return !fila.size; }

// ── LER O TEXTO DO ENVIO (formato do WhatsApp ou linha solta) ──
const TAM = '(XGG|XG|GG|G1|G2|G3|G4|PP|UN|U|P|M|G|3[4-9]|4\\d|5[0-4])';
const reSolta = new RegExp('^(\\d{6,8})\\s+(.+?)\\s+'+TAM+'\\s*[:=x]?\\s*(\\d{1,4})\\s*(p[cç]s?|pe[cç]as?)?$','i');
const reTam = new RegExp('^'+TAM+'\\s*[:=]\\s*(\\d{1,4})\\b','i');
function lerTexto(txt){
  const itens=[]; const erros=[]; let titulo=''; let cod=null, desc='', cor=null;
  const mapa=new Map();
  const add=(c,d,co,t,q)=>{ const k=c+'|'+co+'|'+t; if(mapa.has(k)){ mapa.get(k).ped+=q; return; } const it={cod:c,desc:d,cor:co,tam:t,ped:q}; mapa.set(k,it); itens.push(it); };
  String(txt||'').split(/\r?\n/).forEach((bruta,n)=>{
    let l = bruta.replace(/ /g,' ').trim(); if(!l) return;
    l = l.replace(/^[-•·▪●*]+\s*(?=\*|\S)/,'').trim();
    const limpo = l.replace(/\*/g,'').replace(/\s+/g,' ').trim();
    if(!limpo) return;
    let m;
    if(/^ENVIO\b/i.test(limpo) && !/^\d/.test(limpo)){ if(!titulo) titulo = limpo.replace(/\s+[–-]\s+\d+\s*pe[cç]as.*$/i,''); return; }
    if((m = limpo.match(reSolta))){ add(m[1], '', m[2].toUpperCase().replace(/\s*[:–-]\s*$/,''), m[3].toUpperCase(), Number(m[4])); cod=m[1]; desc=''; cor=m[2].toUpperCase(); return; }
    if((m = limpo.match(/^(\d{6,8})\b\s*(.*)$/)) && !/:\s*\d+\s*$/.test(limpo)){ cod=m[1]; desc=m[2].replace(/\s+[–-]\s+\d+\s*pe[cç]as.*$/i,'').toUpperCase(); cor=null; return; }
    if((m = limpo.match(reTam))){
      if(!cod||!cor){ erros.push('Linha '+(n+1)+': tamanho sem código ou cor antes ("'+limpo+'")'); return; }
      add(cod, desc, cor, m[1].toUpperCase(), Number(m[2])); return;
    }
    if(cod && !/\d+\s*$/.test(limpo) && limpo.length<=40){ cor = limpo.toUpperCase().replace(/[:\s]+$/,''); return; }
    erros.push('Linha '+(n+1)+': não entendi "'+limpo+'"');
  });
  return { titulo, itens: itens.filter(i=>i.ped>0), erros };
}

// ── estado de tela ──
let ESTADO = { lista:null, envio:null, relatorio:null, aba:'envios', rascunho:null, filtro:'todos', mostrarOk:false, pinBuf:'', pinUser:null };
let poll=null;

function rota(){ const h=location.hash.replace(/^#\/?/,''); const [a,b]=h.split('/'); return {tela:a||'inicio', id:b}; }
window.addEventListener('hashchange',()=>{ render(); });

function topo(titulo, voltar, extra){
  return '<div class="top"><div class="wrap">'+(voltar?'<button class="back" aria-label="Voltar" onclick="history.length>1?history.back():(location.hash=\'\')">‹</button>':'')+
    '<h1>'+esc(titulo)+'</h1>'+(extra||'')+'<button class="who" onclick="perguntaSair()">'+esc(PESSOAS[S.user].nome)+'</button></div></div>';
}
async function perguntaSair(){ if(await modal('Sair?','Você vai precisar do PIN pra entrar de novo.','Sair','Ficar')) sair(); }

// ── LOGIN ──
function telaLogin(){
  const q=new URLSearchParams(location.search).get('u');
  if(q && PESSOAS[q] && !ESTADO.pinUser) ESTADO.pinUser=q;
  const u=ESTADO.pinUser;
  if(!u){

async function carregarEnvio(id){
  try { const j=await api('ver',{id}); ESTADO.envio=j.envio; ESTADO.envioSujo=false; } catch(e){ toast(e.message); ESTADO.envio={erro:e.message}; }

function agrupar(itens){
  const m=new Map();
  itens.forEach(it=>{
    if(!m.has(it.cod)) m.set(it.cod,{cod:it.cod,desc:it.desc,cores:new Map()});
    const c=m.get(it.cod); if(!c.desc&&it.desc) c.desc=it.desc;
    if(!c.cores.has(it.cor)) c.cores.set(it.cor,{cor:it.cor,itens:[]});
    c.cores.get(it.cor).itens.push(it);
  });
  return [...m.values()].map(c=>({...c,cores:[...c.cores.values()]}));
}

  const i=st==='DIVERGENCIA'?3:ORDEM.indexOf(st);

  return telaResumo(E);
}

function rotRec(it){ if(it.rec==null) return ''; if(it.rec===it.sep) return 'certo'; return it.rec<it.sep?'chegou '+(it.sep-it.rec)+' a menos':'chegou '+(it.rec-it.sep)+' a mais'; }
function telaReceber(E){
  const vis=E.itens.filter(i=>(i.sep||0)>0); const pend=vis.filter(i=>i.rec==null).length;
  let itens=vis; if(ESTADO.filtro==='pend') itens=itens.filter(i=>i.rec==null);
  let h=topo(E.titulo,true,'<span class="save" id="salvo"></span>')+'<div class="wrap">';
  h+='<div class="filtro"><button class="tab '+(ESTADO.filtro==='todos'?'on':'')+'" onclick="filtro(\'todos\')">Tudo ('+vis.length+')</button><button class="tab '+(ESTADO.filtro==='pend'?'on':'')+'" onclick="filtro(\'pend\')" id="fpend">Falta conferir ('+pend+')</button></div>';
  h+='<p class="mini" style="margin-bottom:12px">Confira cada linha. <b>✓</b> = chegou certo. Se veio diferente, digite quanto chegou.</p>';
  if(!itens.length) h+='<div class="vazio"><b>Tudo conferido</b>Aperte "Terminei".</div>';
  h+=agrupar(itens).map(c=>'<div class="cod"><div class="cod-h"><div class="c">'+esc(c.cod)+'</div>'+(c.desc?'<div class="d">'+esc(c.desc)+'</div>':'')+'</div>'+
    c.cores.map(co=>'<div class="cor"><div class="cor-n">'+esc(co.cor)+'</div>'+co.itens.map(it=>
      '<div class="lin '+estadoRec(it)+'" id="l-'+it.id+'"><div class="tm">'+esc(it.tam)+'</div><div class="pd">veio <b>'+it.sep+'</b><small>'+rotRec(it)+'</small></div>'+
      '<input inputmode="numeric" pattern="[0-9]*" aria-label="Recebido '+esc(it.cod+' '+it.cor+' '+it.tam)+'" value="'+(it.rec==null?'':it.rec)+'" onchange="digRec(\''+it.id+'\',this.value)">'+
      '<button class="qb ok" aria-label="Chegou certo" onclick="digRec(\''+it.id+'\','+it.sep+',true)">✓</button></div>').join('')+'</div>').join('')+'</div>').join('');
  h+='</div><div class="bar"><div class="wrap"><div class="pr"><b>'+(vis.length-pend)+' de '+vis.length+' conferidas</b>'+vis.reduce((s,i)=>s+(i.rec||0),0)+' de '+vis.reduce((s,i)=>s+i.sep,0)+' peças</div><button class="btn" onclick="fimRec()">Terminei</button></div></div>';
  return h;
}
function digRec(itemId,v,botao){
  const it=ESTADO.envio.itens.find(i=>i.id===itemId); if(!it) return;
  const s=String(v).trim(); const q= s===''?null:Math.max(0,Math.round(Number(s)));
  if(q!=null && !Number.isFinite(q)) return;
  it.rec=q; enfileirar('receber',ESTADO.envio.id,itemId,q);
  if(ESTADO.filtro==='pend' && botao){ pintar(); return; }
  atualizaLinha(it,'rec');
}
async function fimRec(){
  const E=ESTADO.envio; const vis=E.itens.filter(i=>(i.sep||0)>0);
  const pend=vis.filter(i=>i.rec==null).length;
  if(pend){ await modal('Falta conferir', 'Ainda tem '+plural(pend,'linha','linhas')+' sem conferir. Use o filtro "Falta conferir" pra achar.','Ok'); return; }
  const d=vis.filter(i=>i.rec!==i.sep).length;
  const txt=d?'<b>'+plural(d,'linha veio diferente','linhas vieram diferentes')+'.</b> A Dai vai corrigir a transferência.':'Tudo chegou certo. O envio fecha.';
  if(!await modal('Terminou a conferência?',txt,'Terminei','Voltar')) return;
  if(!await esperarFila()){ toast('Sem internet. Espere salvar e tente de novo.'); return; }
  try { await api('fimRecebimento',{id:E.id}); toast(d?'Foi pra Dai corrigir.':'Envio concluído!'); ESTADO.lista=null; location.hash=''; } catch(e){ toast(e.message); }
}

// Taty: rascunho e resumo
function telaRascunho(E){
  let h=topo(E.titulo,true)+'<div class="wrap">'+trilha(E.status);
  h+='<label class="campo"><span>Nome do envio</span><input id="titulo" value="'+esc(E.titulo)+'" oninput="ESTADO.envioSujo=true"></label>';
  h+='<h2>'+plural(E.itens.length,'linha','linhas')+' · '+E.itens.reduce((s,i)=>s+i.ped,0)+' peças</h2>';
  h+=blocosEdicao(E.itens,'e');
  h+='<button class="btn perigo w" style="margin-top:8px" onclick="excluir()">Apagar este rascunho</button>';
  h+='</div><div class="bar"><div class="wrap"><button class="btn sec" onclick="salvarRasc(false)">Salvar</button><button class="btn ok" style="flex:1" onclick="salvarRasc(true)">Aprovar e mandar</button></div></div>';
  return h;
}
async function salvarRasc(aprovar){
  const E=ESTADO.envio; const t=$('#titulo');
  try {
    await api('editar',{id:E.id,titulo:t?t.value:E.titulo,itens:E.itens.filter(i=>i.ped>0)});
    if(aprovar){
      if(!await modal('Mandar pra Ana?','A lista aparece no celular dela na hora.','Mandar','Voltar')){ toast('Salvo'); return; }
      await api('aprovar',{id:E.id}); toast('Enviado pra Ana');
    } else toast('Salvo');
    carregarEnvio(E.id);
  } catch(e){ toast(e.message); }
}
async function excluir(){
  if(!await modal('Apagar o envio?','Isso não tem volta.','Apagar','Cancelar',true)) return;
  try { await api('excluir',{id:ESTADO.envio.id}); ESTADO.lista=null; location.hash=''; } catch(e){ toast(e.message); }
}
async function voltarEtapa(){
  if(!await modal('Voltar uma etapa?','Use só pra consertar um clique errado. O que já foi digitado continua lá.','Voltar etapa','Cancelar',true)) return;
  try { await api('voltar',{id:ESTADO.envio.id}); toast('Voltou'); carregarEnvio(ESTADO.envio.id); } catch(e){ toast(e.message); }
}
function telaResumo(E){
  const st=E.status;
  let h=topo(E.titulo,true)+'<div class="wrap">'+trilha(st);
  h+='<div style="margin:14px 0">'+chip(st)+(ETAPA[st].quem?' <span class="mini">agora com '+ETAPA[st].quem+'</span>':'')+'</div>';
  const temSep=E.itens.some(i=>i.sep!=null), temRec=E.itens.some(i=>i.rec!=null);
  h+=agrupar(E.itens).map(c=>'<div class="cod"><div class="cod-h"><div class="c">'+esc(c.cod)+'</div>'+(c.desc?'<div class="d">'+esc(c.desc)+'</div>':'')+'</div>'+
    c.cores.map(co=>'<div class="cor"><div class="cor-n">'+esc(co.cor)+'</div><table class="tb"><tr><th>Tam</th><th>Pedido</th>'+(temSep?'<th>Separado</th>':'')+(temRec?'<th>Chegou</th>':'')+'</tr>'+
      co.itens.map(it=>'<tr><td>'+esc(it.tam)+'</td><td>'+it.ped+'</td>'+
        (temSep?'<td class="'+(it.sep==null?'':(it.sep<it.ped?'x':'o'))+'">'+(it.sep==null?'·':it.sep)+'</td>':'')+
        (temRec?'<td class="'+(it.rec==null?'':(it.rec!==(it.sep||0)?'x':'o'))+'">'+(it.rec==null?'·':it.rec)+'</td>':'')+'</tr>').join('')+'</table></div>').join('')+'</div>').join('');
  h+='<h2>Histórico</h2><div class="hist">'+(E.hist||[]).map(x=>hora(x.em)+' · '+esc(PESSOAS[x.por]?.nome||x.por)+': '+esc(ETAPA[x.st]?.l||x.st)+(x.nota?' ('+esc(x.nota)+')':'')).join('<br>')+'</div>';
  if(S.user==='taty' && st!=='RASCUNHO') h+='<button class="btn perigo w" style="margin-top:20px" onclick="voltarEtapa()">Voltar uma etapa</button>';
  if(S.user==='taty') h+='<button class="btn sec w" style="margin-top:10px" onclick="excluir()">Apagar envio</button>';
  return h+'</div>';
}

// Taty: relatório de faltas
async function carregarRel(){
  try { ESTADO.relatorio=await api('relatorio'); } catch(e){ toast(e.message); }
  if(['faltas','inicio'].includes(rota().tela)) pintar();
}
function telaFaltas(){
  const R=ESTADO.relatorio;
  let h=topo('Faltas e diferenças',true)+'<div class="wrap">';
  if(!R) return h+'<div class="carreg">carregando...</div></div>';
  const pend=R.faltas.filter(f=>!f.ok);
  const lista=ESTADO.mostrarOk?R.faltas:pend;
  h+='<h2>A Ana não encontrou ('+pend.length+' pra verificar)</h2>';
  h+='<p class="mini" style="margin-bottom:10px">Pedido pela lista e não achado no estoque. Confira se precisa conciliar e marque ✓.</p>';
  if(!lista.length) h+='<div class="vazio"><b>Nada pendente</b>Tudo que faltou já foi verificado.</div>';
  else {
    const porEnvio=new Map(); lista.forEach(f=>{ if(!porEnvio.has(f.envio)) porEnvio.set(f.envio,{titulo:f.titulo,criado:f.criado,l:[]}); porEnvio.get(f.envio).l.push(f); });
    porEnvio.forEach((g)=>{
      h+='<div class="mini" style="margin:12px 0 6px;font-weight:600">'+esc(g.titulo)+' · '+dataCurta(g.criado)+'</div><div class="cod">'+
        g.l.map(f=>'<div class="fl '+(f.ok?'ok':'')+'"><div class="i"><b>'+esc(f.cod)+'</b> '+esc(f.cor)+' <b>'+esc(f.tam)+'</b><div>pediu '+f.ped+', separou '+f.sep+(f.desc?' · '+esc(f.desc):'')+'</div></div><div class="q">-'+(f.ped-f.sep)+'</div>'+
          '<button class="ck" aria-label="Verificado" onclick="verif(\''+f.envio+'\',\''+f.item+'\','+(!f.ok)+')">'+(f.ok?'✓':'')+'</button></div>').join('')+'</div>';
    });
  }
  h+='<button class="btn sec w" style="margin-top:6px" onclick="ESTADO.mostrarOk=!ESTADO.mostrarOk;pintar()">'+(ESTADO.mostrarOk?'Esconder as já verificadas':'Mostrar também as já verificadas')+'</button>';
  h+='<h2>Diferenças no recebimento ('+R.divs.length+')</h2>';
  if(!R.divs.length) h+='<div class="vazio"><b>Nenhuma diferença</b>Tudo que a Gi conferiu bateu.</div>';
  else h+='<div class="cod">'+R.divs.map(d=>'<div class="fl"><div class="i"><b>'+esc(d.cod)+'</b> '+esc(d.cor)+' <b>'+esc(d.tam)+'</b><div>'+esc(d.titulo)+' · transferido '+d.sep+', chegou '+d.rec+(d.status==='DIVERGENCIA'?' · Dai corrigindo':'')+'</div></div><div class="q">'+(d.rec-d.sep>0?'+':'')+(d.rec-d.sep)+'</div></div>').join('')+'</div>';
  return h+'</div>';
}
async function verif(envio,item,ok){
  const f=ESTADO.relatorio.faltas.find(x=>x.envio===envio&&x.item===item); if(f){ f.ok=ok; pintar(); }
  try { await api('verificado',{id:envio,item,ok}); } catch(e){ toast(e.message); if(f){ f.ok=!ok; pintar(); } }
}

// ── desenhar ──
function pintar(){
  const app=$('#app');
  const foco=document.activeElement&&document.activeElement.id;
  if(!S){ app.innerHTML=telaLogin(); return; }
  const r=rota();
  if(r.tela==='e' && r.id) app.innerHTML=telaEnvio(r.id);
  else if(r.tela==='novo' && S.user==='taty') app.innerHTML=telaNovo();
  else if(r.tela==='faltas' && S.user==='taty') app.innerHTML=telaFaltas();
  else app.innerHTML=telaInicio();
  marcaSalvo();
  if(foco&&document.getElementById(foco)&&foco!=='txt') document.getElementById(foco).focus();
}
function render(){
  clearInterval(poll); poll=null;
  if(!S){ pintar(); return; }
  const r=rota();
  ESTADO.filtro='todos';
  if(r.tela==='e'&&r.id){ ESTADO.envio=null; pintar(); }
  else if(r.tela==='faltas'){ pintar(); carregarRel(); }
  else if(r.tela==='novo'){ pintar(); }
  else {
    pintar(); carregarLista(); if(S.user==='taty') carregarRel();
    poll=setInterval(()=>{ if(document.visibilityState==='visible' && rota().tela==='inicio') carregarLista(); },30000);
  }
  if(fila.size) rodarFila();
}
// quem é só de uma etapa e tem um envio só esperando cai direto nele
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && S && rota().tela==='inicio') carregarLista(); });
render();
</script>
